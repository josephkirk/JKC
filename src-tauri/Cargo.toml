[package]
name = "jkc"
version = "0.1.0"
description = "JKC — Joseph Kirk's Canvas"
authors = ["Joseph Kirk"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "jkc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.12.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
rusqlite = { version = "0.33", features = ["bundled"] }
uuid = { version = "1.15", features = ["v4", "serde"] }
walkdir = "2.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parking_lot = "0.12"
dirs = "6.0"
tempfile = "3.17"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.11"
sha2 = "0.10"
